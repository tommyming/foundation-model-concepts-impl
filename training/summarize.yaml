# Phase 3 adapter: summarize. Same base, same hyperparameters as classify.yaml.
model: "mlx-community/Qwen3-1.7B-4bit"
train: true
data: "./data/summarize"
adapter_path: "./adapters/summarize"
fine_tune_type: lora
num_layers: 16
iters: 600
batch_size: 4
learning_rate: 1e-5
mask_prompt: true
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.0
